<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e6ebef">
<title>The Scan Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
body{{margin:0}}
img{{max-width:100%}}
/* Layout: a radiology reading room. Light-box panels around black scanner viewports; greyscale tissue, with the fMRI "hot" colormap reserved for activation and correct answers. */
:root{
  --bg:#e6ebef; --panel:#f6f8fa; --panel2:#edf1f4; --ink:#14202b; --muted:#56687a; --line:#c3ced7;
  --brain:#d8dee3; --hover:#bccad6; --rim:#a6b3bf; --rim-strong:#5f7184; --sulcus:#7b8a99; --crest:#f7f9fb;
  --l-front:#c7d4e6; --l-mot:#e9c8bd; --l-som:#ead9b2; --l-par:#d7cfe7; --l-temp:#c6e0d0; --l-occ:#e8c9d6; --l-cb:#d5d9c0; --l-bs:#d6cdc4;
  --hot:#e0532a; --hot2:#f2b322; --cool:#2a7d9c;
  --good:#257a4d; --bad:#b8352a; --bad-soft:#efc9c4; --good-soft:#cfe8d9;
  --vp:#000; --vp-ink:#cbd9e4; --vp-dim:#71879a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1318; --panel:#141e27; --panel2:#18242f; --ink:#e2e9ef; --muted:#8c9eae; --line:#273541;
  --brain:#38454f; --hover:#4a5b6b; --rim:#4c5c6b; --rim-strong:#8193a5; --sulcus:#192229; --crest:#5d6e7d;
  --l-front:#304558; --l-mot:#5a3a31; --l-som:#574b2d; --l-par:#41395a; --l-temp:#2d4c3d; --l-occ:#533545; --l-cb:#444833; --l-bs:#48413a;
  --hot:#ff6a3c; --hot2:#ffc73a; --cool:#4fb2d3;
  --good:#4cc38a; --bad:#ff7066; --bad-soft:#4a2624; --good-soft:#1d3b2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1318; --panel:#141e27; --panel2:#18242f; --ink:#e2e9ef; --muted:#8c9eae; --line:#273541;
  --brain:#38454f; --hover:#4a5b6b; --rim:#4c5c6b; --rim-strong:#8193a5; --sulcus:#192229; --crest:#5d6e7d;
  --l-front:#304558; --l-mot:#5a3a31; --l-som:#574b2d; --l-par:#41395a; --l-temp:#2d4c3d; --l-occ:#533545; --l-cb:#444833; --l-bs:#48413a;
  --hot:#ff6a3c; --hot2:#ffc73a; --cool:#4fb2d3;
  --good:#4cc38a; --bad:#ff7066; --bad-soft:#4a2624; --good-soft:#1d3b2c; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 0,var(--bg) 70%);pointer-events:none;z-index:-1}
#app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}
.brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.brand b{color:var(--ink);font-weight:500}
.rec{width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 25%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.readout{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);white-space:nowrap}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:.92;text-transform:uppercase;letter-spacing:.01em}
h1{font-size:clamp(68px,15vw,136px);font-weight:800}
h1 span{color:var(--hot)}
h2{font-size:clamp(38px,8vw,58px);font-weight:800;margin-bottom:14px}
h3{font-size:30px;font-weight:700}
p{margin:0}
.lead{font-size:18px;max-width:62ch}
.cap{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.03em;margin-top:8px;line-height:1.45}
figure{margin:0}
svg{display:block;max-width:100%;height:auto}

.intro{display:grid;grid-template-columns:1fr;gap:14px 28px;align-items:end;margin-bottom:22px}
@media (min-width:760px){.intro{grid-template-columns:auto 1fr}}
.intro .lead{padding-bottom:6px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.phead{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 10px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.phead b{color:var(--ink);font-weight:500}
.lab{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:34px}
@media (min-width:760px){.lab{grid-template-columns:1.25fr 1fr}}

/* viewport */
.vp{position:relative;background:var(--vp);border-radius:4px;overflow:hidden;aspect-ratio:1/1;width:100%;max-width:100%}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vp canvas.ovl{mix-blend-mode:normal}
.ov{position:absolute;font-family:var(--f-mono);font-size:10.5px;color:var(--vp-ink);letter-spacing:.04em;line-height:1.35;pointer-events:none;text-shadow:0 0 3px #000}
.ov.tl{top:8px;left:9px}.ov.tr{top:8px;right:9px;text-align:right}.ov.bl{bottom:8px;left:9px}.ov.br{bottom:8px;right:9px;text-align:right}
.ov.ol{left:6px;top:50%;transform:translateY(-50%)}.ov.or{right:6px;top:50%;transform:translateY(-50%)}
.ov.ot{top:24px;left:50%;transform:translateX(-50%)}.ov.ob{bottom:24px;left:50%;transform:translateX(-50%)}
.ov.dim{color:var(--vp-dim)}
.sbar{display:block;height:2px;background:var(--vp-ink);margin-bottom:3px}
.xh{position:absolute;pointer-events:none;border-color:rgba(242,179,34,.35);border-style:dashed;border-width:0}
.xh.h{left:0;right:0;top:50%;border-top-width:1px}.xh.v{top:0;bottom:0;left:50%;border-left-width:1px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ctl label{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.ctl label b{color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--hot)}
.explain{font-size:14px;color:var(--muted);margin-top:10px;max-width:60ch}
.explain b{color:var(--ink)}

/* stations */
.stations{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:620px){.stations{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.stations{grid-template-columns:1fr 1fr 1fr}}
.station{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;overflow:hidden}
.station .glyph{position:absolute;right:12px;top:12px;width:62px;height:62px;opacity:.9}
.station p.desc{color:var(--muted);font-size:15px;flex:1;padding-right:4px}
.station h3{padding-right:70px}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status.done{color:var(--good)}
.report{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.report .eyebrow,.report p.desc{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.meter{display:flex;gap:3px;margin-top:4px}
.meter i{flex:1;height:8px;border-radius:2px;background:color-mix(in srgb,var(--bg) 22%,var(--ink))}
.meter i.on{background:var(--hot)}

.btn{font:700 15px/1 var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:12px 18px;cursor:pointer;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.report .btn{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--hot2);outline-offset:2px}
.back{font:500 13px var(--f-mono);background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}

.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--hot)} .dots i.no{background:var(--rim-strong)} .dots i.cur{box-shadow:0 0 0 2px var(--hot2)}
.case{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.split{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.split{grid-template-columns:1.2fr 1fr}.split.even{grid-template-columns:1fr 1fr}}

/* brain */
.reg{fill:var(--brain);stroke:var(--rim);stroke-width:.7;stroke-dasharray:2 3;transition:fill .15s}
.atlas .reg[data-id=frontal],.atlas .reg[data-id=broca]{fill:var(--l-front)}
.atlas .reg[data-id=motor]{fill:var(--l-mot)} .atlas .reg[data-id=somato]{fill:var(--l-som)}
.atlas .reg[data-id=parietal]{fill:var(--l-par)} .atlas .reg[data-id=temporal],.atlas .reg[data-id=wernicke]{fill:var(--l-temp)}
.atlas .reg[data-id=occipital]{fill:var(--l-occ)} .atlas .reg[data-id=cerebellum]{fill:var(--l-cb)} .atlas .reg[data-id=stem]{fill:var(--l-bs)}
.atlas .reg{stroke:none}
svg.interactive .reg{cursor:pointer}
svg.interactive:not(.done) .reg:hover{fill:var(--hover)}
.reg:focus{outline:none}
.reg:focus-visible{stroke:var(--hot2);stroke-width:2.5}
.reg.answer{fill:var(--hot)!important;stroke:var(--hot2);stroke-width:2}
.reg.miss{fill:var(--bad-soft)!important;stroke:var(--bad);stroke-width:2}
.outline{fill:none;stroke:var(--rim-strong);stroke-width:1.8}
.sulci{pointer-events:none}
.sulci path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sulci .cr{stroke:var(--crest);stroke-width:1.3;opacity:.8}
.sulci .su{stroke:var(--sulcus);stroke-width:1.5}
.sulci .mj{stroke-width:2.6}
.sulci .mn{stroke-width:1;opacity:.75}
.shade{pointer-events:none}
.rlabel{font:500 9.5px var(--f-mono);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:3px;letter-spacing:.04em;text-transform:uppercase}
.slice-line{stroke:var(--hot2);stroke-width:1.6;stroke-dasharray:6 4}
.slice-tag{font:500 9px var(--f-mono);fill:var(--hot)}
.brainwrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 8px 10px}

/* feedback */
.fb{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-top:14px}
.verdict{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.vtext{font-weight:700}
.fb .btn{align-self:flex-start;margin-top:4px}
.fb .vp{max-width:320px}

/* options */
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){.opts.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{font:inherit;color:var(--ink);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 13px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--rim-strong)}
.opt:disabled{cursor:default}
.opt b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:.02em;line-height:1}
.opt small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}

/* charts */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.ax{stroke:var(--rim-strong);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.ptxt{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.ptitle{font-family:var(--f-mono);font-size:9px;fill:var(--ink);letter-spacing:.06em}
.mbox{fill:var(--brain);stroke:var(--rim-strong);stroke-width:1;opacity:.9}
.mbox.ans{fill:var(--hot);stroke:var(--hot2);stroke-width:2;opacity:1}
.mbox.wr{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.mlab{font:700 11px var(--f-mono);fill:var(--ink);pointer-events:none}
.trace{fill:none;stroke:var(--hot);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.trace.base{stroke:var(--rim-strong)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dash{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.guess{stroke:var(--hot2);stroke-width:2;stroke-dasharray:5 3}
.cursor{stroke:var(--cool);stroke-width:1.5}
.stim{fill:var(--cool)}

/* neuron */
.neuron{max-width:680px;margin:0 auto}
.neuron .mem{fill:var(--brain);stroke:var(--rim-strong);stroke-width:1.2}
.neuron .den{fill:none;stroke:var(--rim-strong);stroke-linecap:round}
.neuron .axon{stroke:var(--rim-strong);stroke-width:3;stroke-linecap:round}
.neuron .myelin{fill:var(--panel2);stroke:var(--rim-strong);stroke-width:1}
.neuron .node{fill:var(--hot2);opacity:0}
.neuron .node.lit{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.neuron .nuc{fill:var(--rim-strong);opacity:.5}
.spike{fill:var(--hot2);filter:drop-shadow(0 0 4px var(--hot))}

.cards{display:grid;grid-template-columns:1fr;gap:8px}
.card{font:inherit;font-size:15px;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 13px;cursor:pointer}
.card:hover{border-color:var(--rim-strong)}
.card.placed{display:none}
.card.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.seq{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.seq:empty{display:none}
.seq li{font-size:14.5px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline}
.seq li span{font-family:var(--f-mono);font-size:12px;color:var(--hot)}

.slider{display:flex;flex-direction:column;gap:8px}
.slider label{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}

.result{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.big{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:32px;opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap}
.foot{margin-top:28px;font-size:13px;color:var(--muted);max-width:66ch}

@media (prefers-reduced-motion: reduce){.draw{animation:none;stroke-dashoffset:0}.card.shake,.rec,.neuron .node.lit{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="brand"><i class="rec" aria-hidden="true"></i><b>The Scan Room</b><span>· 3 T imaging lab</span></span>
    <span class="readout" id="readout">Score 0 / 27</span>
  </header>
  <main id="view"></main>
</div>

<script>
(function(){
const view=document.getElementById('view');
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const MAX={map:6,scan:5,neuron:6,bold:5,read:5};
const TOTAL=27;
const EMPTY={map:null,scan:null,neuron:null,bold:null,read:null};
let scores=Object.assign({},EMPTY,store.get('scanroom-v2')||{});
function save(){store.set('scanroom-v2',scores)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sum(){return Object.values(scores).reduce((s,v)=>s+(v||0),0)}
function readout(live){document.getElementById('readout').textContent='Score '+(sum()+(live||0))+' / '+TOTAL}
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(i,j){let h=(Math.imul(i|0,374761393)+Math.imul(j|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function capDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function wrap(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}

/* ================= Lateral brain illustration ================= */
const r1=v=>Math.round(v*10)/10;
function cr(p){let d='';for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
 d+=`C${r1(p1[0]+(p2[0]-p0[0])/6)} ${r1(p1[1]+(p2[1]-p0[1])/6)} ${r1(p2[0]-(p3[0]-p1[0])/6)} ${r1(p2[1]-(p3[1]-p1[1])/6)} ${p2[0]} ${p2[1]}`}return d}
const op=p=>`M${p[0][0]} ${p[0][1]}`+cr(p);
function region(segs){let d=`M${segs[0][0][0]} ${segs[0][0][1]}`;segs.forEach(s=>{d+=`L${s[0][0]} ${s[0][1]}`;if(s.length>1)d+=cr(s)});return d+'Z'}
const rev=a=>a.slice().reverse(), sub=(a,i,j)=>a.slice(i,j+1);
// landmark sulci (lateral view, left hemisphere, frontal pole on the left)
const SYL=[[116,184],[136,177],[156,169],[176,163],[194,159],[212,156],[232,152],[250,146],[262,138],[272,126]];
const CEN=[[216,0],[214,28],[207,52],[204,78],[196,104],[188,128],[182,148],[176,163]];

 const cx=256,cy=196,R=168,im=ctx.getImageData(0,0,W,W),P=im.data;
 const src=[[-.58,-.2,1],[-.5,.32,-1],[.52,.3,.75],[.6,-.2,-.75]];
 for(let y=cy-R;y<=cy+R;y++)for(let x=cx-R;x<=cx+R;x++){const nx=(x-cx)/R,ny=(y-cy)/R;if(nx*nx+ny*ny>1)continue;
  let v=0;for(const [a,b,s] of src)v+=s*Math.exp(-((nx-a)**2+(ny-b)**2)/.09);
  const q=v/.16,frac=q-Math.floor(q),line=frac<.09||frac>.97;let r,g,b;const m=Math.min(1,Math.abs(v));
  if(v>=0){r=40+215*m;g=24+50*m;b=24+20*m}else{r=20+30*m;g=40+100*m;b=50+205*m}
  if(line){r=Math.min(255,r+60);g=Math.min(255,g+60);b=Math.min(255,b+60)}
  const j=(y*W+x)*4;P[j]=r;P[j+1]=g;P[j+2]=b;P[j+3]=255}
 ctx.putImageData(im,0,0);
 ctx.strokeStyle='#71879a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
 ctx.beginPath();ctx.moveTo(cx-16,cy-R+2);ctx.lineTo(cx,cy-R-18);ctx.lineTo(cx+16,cy-R+2);ctx.stroke();
 ctx.beginPath();ctx.ellipse(cx-R-6,cy,8,24,0,0,TAU);ctx.stroke();ctx.beginPath();ctx.ellipse(cx+R+6,cy,8,24,0,0,TAU);ctx.stroke();
 ctx.fillStyle='rgba(220,232,240,.75)';[[0,1],[.2,6],[.4,12],[.6,18],[.8,24],[.95,30]].forEach(([rr,n])=>{for(let k=0;k<n;k++){const a=k/n*TAU+rr;ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr*R,cy+Math.sin(a)*rr*R,2.6,0,TAU);ctx.fill()}});
 ctx.font='500 16px '+VPF;ctx.fillStyle='#ff8a64';ctx.fillText('+150 fT',14,30);ctx.fillStyle='#6aa6ff';ctx.fillText('−150 fT',14,52);
 const bx0=60,bx1=490,by=470,bh=72;ctx.strokeStyle='#71879a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx0,by);ctx.lineTo(bx1,by);ctx.stroke();
 ctx.fillStyle='#71879a';[0,100,200,300].forEach(t=>{const x=bx0+t/300*(bx1-bx0);ctx.fillText(t+'',x-10,by+20)});ctx.fillText('ms',bx1-14,by-6);
 ctx.strokeStyle='rgba(255,199,58,.5)';ctx.setLineDash([4,4]);const xm=bx0+100/300*(bx1-bx0);ctx.beginPath();ctx.moveTo(xm,by-bh-12);ctx.lineTo(xm,by);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffc73a';ctx.fillText('M100',xm+5,by-bh-2);
 for(let k=0;k<26;k++){const a=(hash(k,seed+3)*2-1);ctx.strokeStyle=k===3?'#ff8a64':'rgba(205,218,228,.35)';ctx.lineWidth=k===3?2:1;ctx.beginPath();
  for(let x=bx0;x<=bx1;x+=2){const t=(x-bx0)/(bx1-bx0)*300;const w=Math.exp(-Math.pow((t-100)/20,2))-.35*Math.exp(-Math.pow((t-190)/40,2))+.2*Math.exp(-Math.pow((t-52)/11,2));
   const v=(k===3?1:a)*w*bh*.85+(hash(x,k+seed)-.5)*5;x===bx0?ctx.moveTo(x,by-bh/2-v*.5):ctx.lineTo(x,by-bh/2-v*.5)}ctx.stroke()}
}
function drawFNIRS(ctx,seed){
 const W=512;ctx.fillStyle='#000';ctx.fillRect(0,0,W,W);
 ctx.strokeStyle='#71879a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(256,168,120,140,0,0,TAU);ctx.stroke();
 ctx.beginPath();ctx.moveTo(240,30);ctx.lineTo(256,10);ctx.lineTo(272,30);ctx.stroke();
 const xs=[166,211,256,301,346],ys=[78,122];
 ctx.lineWidth=3;for(let r=0;r<2;r++)for(let c=0;c<5;c++){const nb=[[r,c+1],[r+1,c]];nb.forEach(([rr,cc])=>{if(rr<2&&cc<5){const act=Math.exp(-Math.pow((xs[c]+xs[cc])/2-226,2)/3000);ctx.strokeStyle=`rgba(255,${200-act*130},${120-act*90},${.35+act*.6})`;ctx.beginPath();ctx.moveTo(xs[c],ys[r]);ctx.lineTo(xs[cc],ys[rr]);ctx.stroke()}})}
 for(let r=0;r<2;r++)for(let c=0;c<5;c++){const src=(r+c)%2===0;ctx.fillStyle=src?'#ff6b5e':'#5aa9ff';if(src){ctx.beginPath();ctx.arc(xs[c],ys[r],9,0,TAU);ctx.fill()}else ctx.fillRect(xs[c]-8,ys[r]-8,16,16)}
 ctx.font='500 16px '+VPF;ctx.fillStyle='#ff6b5e';ctx.fillText('● source',20,250);ctx.fillStyle='#5aa9ff';ctx.fillText('■ detector',20,272);
 const x0=60,x1=496,y0=470,yz=400,k=95;ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x0+10/40*(x1-x0),300,20/40*(x1-x0),y0-300);
 ctx.fillStyle='#71879a';ctx.fillText('task',x0+10/40*(x1-x0)+6,318);
 ctx.strokeStyle='#71879a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,yz);ctx.lineTo(x1,yz);ctx.stroke();
 [0,10,20,30,40].forEach(t=>ctx.fillText(t+'',x0+t/40*(x1-x0)-8,y0+24));ctx.fillText('s',x1-6,y0+6);ctx.fillText('Δ µM',6,330);
 const shape=t=>{const sm=u=>u<=0?0:u>=1?1:u*u*(3-2*u);return sm((t-12)/7)-sm((t-31)/7)};
 [['#ff6b5e',.62,0,'HbO'],['#5aa9ff',-.22,1,'HbR']].forEach(([col,amp,lag,lab],q)=>{ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.beginPath();
  for(let x=x0;x<=x1;x++){const t=(x-x0)/(x1-x0)*40;const v=amp*shape(t-lag)+(q?.015:.05)*Math.sin(TAU*.1*t+q)+(q?0:.03*Math.sin(TAU*1.1*t))+(hash(x,q+seed)-.5)*.03;x===x0?ctx.moveTo(x,yz-v*k):ctx.lineTo(x,yz-v*k)}ctx.stroke();
  ctx.fillStyle=col;ctx.fillText(lab,x1-46,q?yz+44:yz-70)});
}
const FMRI_SITES=[{x:.08,y:.8,r:.07,a:1},{x:-.08,y:.8,r:.07,a:.9},{x:.6,y:.08,r:.07,a:.8},{x:-.6,y:.08,r:.07,a:.75}];
function paintScan(cv,type,z,seed){
 const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.clearRect(0,0,cv.width,cv.height);
 if(type==='eeg')return drawEEG(ctx,seed||1);
 if(type==='meg')return drawMEG(ctx,seed||1);
 if(type==='fnirs')return drawFNIRS(ctx,seed||1);
 if(type==='fmri'){ctx.drawImage(renderSlice('epi',z,seed),0,0,cv.width,cv.height);ctx.drawImage(blobCanvas(z,FMRI_SITES),0,0,cv.width,cv.height);return}
 if(type==='smri')type='t1';if(type==='dti')type='fa';
 ctx.drawImage(renderSlice(type,z,seed),0,0,cv.width,cv.height);
}

function head(code,title,round,n,res){
 const dots=Array.from({length:n},(_,k)=>`<i class="${res[k]===true?'ok':res[k]===false?'no':''}${k===round&&res[k]===undefined?' cur':''}"></i>`).join('');
 return `<div class="shead"><button class="back" data-back>← All stations</button><div class="dots" aria-hidden="true">${dots}</div></div><p class="eyebrow">Station ${code}</p><h2>${title}</h2>`;
}
function bindBack(){view.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{stopAnim();hub()})}
function verdict(ok,text){return `<p class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite'}</p>${text?`<p class="vtext">${text}</p>`:''}`}
function showFb(el,html,label,next){el.hidden=false;el.innerHTML=html+`<button class="btn" id="nextBtn">${label}</button>`;
 document.getElementById('nextBtn').onclick=()=>{stopAnim();next()};el.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'})}
function top(){window.scrollTo(0,0)}
let animId=0;function stopAnim(){cancelAnimationFrame(animId);animId=0}
function setDot(i,ok){const d=view.querySelectorAll('.dots i')[i];if(d)d.className=ok?'ok':'no'}
function mcq(container,q,done){
 const order=shuffle(q.opts.map((t,i)=>({t,i})));
 container.innerHTML=`<div class="case"><p class="lead">${q.q}</p></div><div class="opts">${order.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="fb" hidden></div>`;
 const btns=container.querySelectorAll('.opt');
 btns.forEach(b=>b.onclick=()=>{const ok=b.dataset.i==='0';
  btns.forEach(x=>{x.disabled=true;if(x.dataset.i==='0')x.classList.add('right');else if(x===b)x.classList.add('wrong');else x.classList.add('dim')});
  done(ok,container.querySelector('.fb'),verdict(ok,'')+`<p>${q.why}</p>`)});
}
function finish(key,score,code,title,replay){
 scores[key]=score;save();readout();top();
 const pct=score/MAX[key];
 const line=pct===1?'Flawless. The lab director noticed.':pct>=.66?'Solid work. A couple of slips to review.':pct>=.34?'Getting there. Run it again to lock it in.':'Rough shift. The explanations are the point, so try again.';
 view.innerHTML=`<div class="shead"><button class="back" data-back>← All stations</button></div><p class="eyebrow">Station ${code} complete</p><h2>${title}</h2>
 <div class="result"><div class="big">${score}<small> / ${MAX[key]}</small></div><p>${line}</p>
 <div class="row"><button class="btn" id="toHub">Back to stations</button><button class="btn ghost" id="again">Play again</button></div></div>`;
 bindBack();document.getElementById('toHub').onclick=hub;document.getElementById('again').onclick=replay;
}

  view.innerHTML=head('A','Cortex Map',i,qs.length,res)+`<div class="case"><p class="eyebrow">Case ${i+1} of ${qs.length} · tap the region</p><p class="lead">${q.q}</p></div>
  <figure class="brainwrap"><div class="phead"><span>Lateral view · left hemisphere</span><span>Anterior ←</span></div>${brainSVG({interactive:true})}<figcaption class="cap">The front of the head is on the left. The thick groove is the lateral (Sylvian) fissure; the long one crossing it from the top is the central sulcus.</figcaption></figure><div class="fb" id="fb" hidden></div>`;
  bindBack();
  view.querySelectorAll('.reg').forEach(el=>{const go=()=>answer(el.dataset.id);el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
 }
 const nm=id=>REG[id].name.replace(/^([A-Z])/,m=>m.toLowerCase()).replace(/^broca/,'Broca').replace(/^wernicke/,'Wernicke');
 function answer(id){if(locked)return;locked=true;
  const q=qs[i],ok=id===q.id;if(ok)score++;res[i]=ok;readout(score);
  const svg=view.querySelector('svg.brain');svg.classList.add('done');svg.querySelectorAll('.reg').forEach(r=>r.removeAttribute('tabindex'));
  svg.querySelector(`[data-id="${q.id}"]`).classList.add('answer');labelRegion(svg,q.id);
  if(!ok){svg.querySelector(`[data-id="${id}"]`).classList.add('miss');labelRegion(svg,id)}
  setDot(i,ok);
  showFb(document.getElementById('fb'),verdict(ok,ok?REG[q.id].name:`You chose the ${nm(id)}. The answer is the ${nm(q.id)}.`)+`<p>${q.why}</p>`,
   i<qs.length-1?'Next case':'Finish station',()=>{i++;locked=false;if(i<qs.length){render();top()}else finish('map',score,'A','Cortex Map',runMap)});
 }
 render();
}

function runSpike(){

 const step=ts=>{if(t0===null)t0=ts;const e=ts-t0,k=Math.floor(e/hop),u=(e%hop)/hop;
  if(k>=NODES.length-1){sp.setAttribute('cx',NODES[NODES.length-1]);sp.setAttribute('opacity',0);t0=null;animId=requestAnimationFrame(t=>setTimeout(()=>{animId=requestAnimationFrame(step)},500));return}
  const x=NODES[k]+(NODES[k+1]-NODES[k])*Math.min(1,u*2.2);sp.setAttribute('cx',x);sp.setAttribute('opacity',1);
  const nd=document.querySelector(`.node[data-n="${k}"]`);if(u<.08&&nd&&!nd.classList.contains('lit')){nd.classList.add('lit');setTimeout(()=>nd.classList.remove('lit'),500)}

function rank(t){return t>=24?['Principal Investigator','You could run this lab.']:t>=18?['Postdoc','Strong across the board. Revisit your weakest station.']:t>=10?['PhD Student','The basics are there. Replay stations to sharpen up.']:['Lab Intern','Everyone starts here. The explanations after each answer are the lesson.']}
const CONSOLE={t1:'T1',t2:'T2',ct:'CT',fa:'DTI',pet:'PET',fmri:'fMRI'};
const CNOTE={t1:'<b>T1:</b> fat bright, fluid dark, white matter brighter than grey. The workhorse for anatomy.',t2:'<b>T2:</b> fluid bright, so CSF in every sulcus and ventricle glows. White matter turns darker than grey.',ct:'<b>CT:</b> X-ray density. Bone is white, CSF dark, grey and white matter barely differ.',fa:'<b>DTI:</b> colour shows fibre direction. Red left–right, green front–back, blue up–down.',pet:'<b>FDG PET:</b> glucose uptake. Grey matter, thalamus and striatum burn the most energy.',fmri:'<b>fMRI:</b> fast, low-detail EPI with task activation overlaid in visual and auditory cortex.'};
let cMode='t1',cZ=.1,cPend=0;
function hub(){
 stopAnim();top();readout();
 const played=STATIONS.filter(s=>scores[s.k]!=null).length,t=sum(),[r,rl]=rank(t);
 view.innerHTML=`<section class="intro"><div><p class="eyebrow">Neuroscience · Neuroimaging</p><h1>The Scan<br><span>Room</span></h1></div>
 <p class="lead">You've just joined a brain imaging lab. Learn where functions live in the cortex, which scanner answers which question, how a neuron fires and what an fMRI signal really measures.</p></section>
 <section class="lab"><figure class="panel"><div class="phead"><span><b>Atlas</b> · lateral view, left hemisphere</span><span>Anterior ←</span></div>${brainSVG({atlas:true,labels:true,slice:cZ})}
  <figcaption class="cap">Lobes are divided by the central sulcus, the lateral fissure and the parieto-occipital line. The dashed line is the axial slice shown in the console.</figcaption></figure>
  <div class="panel"><div class="phead"><span><b>Console</b> · axial view</span><span id="czmm">z +${Math.round(cZ*100+5)} mm</span></div>
  ${viewport('cv',cMode,{br:'IMG 1/176'})}
  <div class="chips" role="group" aria-label="Contrast">${Object.entries(CONSOLE).map(([k,l])=>`<button class="chip" data-m="${k}" aria-pressed="${k===cMode}">${l}</button>`).join('')}</div>
  <div class="ctl"><label for="zs"><span>Slice height</span><b id="zlab">${zText(cZ)}</b></label><input type="range" id="zs" min="-5" max="68" value="${Math.round(cZ*100)}"></div>
  <p class="explain" id="cnote">${CNOTE[cMode]}</p></div></section>
 <section class="stations">${STATIONS.map(s=>{const v=scores[s.k],has=v!=null;
  return `<article class="station"><span class="glyph" aria-hidden="true">${GLYPH[s.k]}</span><p class="eyebrow">Station ${s.code}</p><h3>${s.title}</h3><p class="desc">${s.desc}</p>
  <div class="sfoot"><span class="status${has?' done':''}">${has?`Scored ${v} / ${MAX[s.k]}`:`${MAX[s.k]} points`}</span><button class="btn${has?' ghost':''}" data-go="${s.k}">${has?'Replay':'Start'}</button></div></article>`}).join('')}
  <article class="station report"><p class="eyebrow">Shift report</p><div class="big">${t}<small> / ${TOTAL}</small></div>
  <div class="meter">${STATIONS.map(s=>`<i class="${scores[s.k]!=null?'on':''}"></i>`).join('')}</div>
  <p class="desc">${played===STATIONS.length?`<b>${r}.</b> ${rl}`:`${played} of 5 stations done. Finish all five for your lab rank.`}</p>
  ${played?`<div class="sfoot"><span></span><button class="btn" id="reset">Clear scores</button></div>`:''}</article></section>
 <p class="foot">Images are simulated from a simplified tissue model, so contrasts behave like the real thing but anatomy is schematic. Cases are drawn at random, so replays bring new rounds. Scores stay in this browser only.</p>`;
 view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>STATIONS.find(s=>s.k===b.dataset.go).run());
 const rs=document.getElementById('reset');if(rs)rs.onclick=()=>{scores=Object.assign({},EMPTY);save();hub()};
 const draw=()=>{paintScan(document.getElementById('cv'),cMode,cZ,3);const w=document.getElementById('cvw'),m=META[cMode];w.querySelector('.tl').innerHTML=m.tl;w.querySelector('.tr').innerHTML=m.tr};
 draw();
 view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{cMode=c.dataset.m;view.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));document.getElementById('cnote').innerHTML=CNOTE[cMode];draw()});
 const zs=document.getElementById('zs');
 zs.oninput=()=>{cZ=+zs.value/100;document.getElementById('zlab').textContent=zText(cZ);document.getElementById('czmm').textContent='z +'+Math.round(cZ*100+5)+' mm';
  const y=sliceY(cZ);view.querySelectorAll('#sliceG line').forEach(l=>{l.setAttribute('y1',y);l.setAttribute('y2',y)});view.querySelector('#sliceG text').setAttribute('y',y-5);
  if(!cPend)cPend=requestAnimationFrame(()=>{cPend=0;draw()})};
}
function zText(z){return z<.0?'basal ganglia, low':z<.2?'ventricles & thalamus':z<.42?'ventricle bodies':z<.55?'corpus callosum, high':'centrum semiovale'}
hub();
})();
</script>
</body>
</html>
